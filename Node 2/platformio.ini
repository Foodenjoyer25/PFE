; ─────────────────────────────────────────────────────────────
;  ESP32-S3  ·  Nœud capteur de lumière  ·  Configuration PlatformIO
; ─────────────────────────────────────────────────────────────

[env:node_b]
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino

; ─── Moniteur série ─────────────────────────────────────────
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder    ; décode les traces de panique en fichier:ligne
    time                       ; préfixe chaque ligne avec l'horodatage
    default                    ; traitement standard des lignes

; ─── Vitesse de téléversement ────────────────────────────────
upload_speed = 921600

; ─── Options de compilation ─────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=3                   ; niveau de log ESP-IDF : 0=aucun 3=info 5=verbose
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0      ; épingle AsyncTCP sur le cœur 0 (cohérent avec netTask)
    -DCONFIG_ASYNC_TCP_TASK_PRIORITY=3
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_USE_WDT=1           ; AsyncTCP alimente le watchdog de tâche

; ─── Bibliothèques ───────────────────────────────────────────
lib_deps =
    me-no-dev/AsyncTCP
    me-no-dev/ESPAsyncWebServer
